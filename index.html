<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="qh_qyzz_helper_tools.js"></script>
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon.ico">
    <link rel="stylesheet" href="01.css">
    </link>
    <title>雀魂-青云之志-护身符&印章</title>
</head>

<body>
    <div class="fu_group">组合</div>

    <h1 class="toggle-header" id="seals-toggle-header">
        <span class="toggle-text" onclick="toggleSeals('seals')">印章 (共21个)</span>
    </h1>

    <div id="seals-container" class="container">
        <div id="seals_l1"></div>
        <div id="seals_l2"></div>
        <div id="seals_l3"></div>
    </div>

    <h1 class="toggle-header" id="fu-toggle-header">
        <span class="toggle-text" onclick="toggleSeals('fu')">护身符 (共142张)</span>
    </h1>

    <div id="fu-container" class="container">
        <div class="box">
            <!-- 参考链接实现： https://blog.csdn.net/weixin_41770018/article/details/83090263 -->
            <style>
                /* 清样式，如果是项目中，不推荐使用通配符来清样式，建议使用标签清样式，通配符清样式会增加页面压力 */
                * {
                    margin: 0;
                    padding: 0;
                }

                /* 宽度为屏宽的一半，高度为屏高的一半，然后居中 */
                .box {
                    width: 90vw;
                    height: auto;
                    margin-left: 0;
                    /* 左边距自动填充，元素会向右对齐 */
                    margin-right: auto;
                    /* 右边距为 0 */
                }

                /* 清除li样式 */
                ul,
                li {
                    list-style: none;
                }

                /* 将ul相对定位，目的是让内容的div绝对定位时相对ul定位，否则会相对body定位 */
                /* ul弹性盒，目的是让li横着排，也可以将li浮动或者转行内块 */
                ul {
                    position: relative;
                    display: flex;
                }

                /* 将三个li宽度平分，高度60px */
                li {
                    flex: 1;
                }

                /* input隐藏 */
                input {
                    display: none;
                }

                /* 设置input的下一个节点label的样式 */
                input+label {
                    display: block;
                    width: 100%;
                    height: 100%;
                    background: #ccc;
                    font-size: 18px;
                    text-align: center;
                    line-height: 60px;
                    color: #333;
                }

                /* 设置div内容的基础样式 隐藏内容div*/
                input+label+div {
                    display: none;
                    position: absolute;
                    left: 0;
                    top: 60px;
                }

                /* input选中状态时候对应的label的样式 */
                input:checked+label {
                    background: #333333;
                    color: #fff;
                }

                /* input选中时候显示对应的div */
                input:checked+label+div {
                    display: block;
                }
            </style>

            <ul>
                <li>
                    <input type="radio" name="check" id="active1" checked><label for="active1">
                        <p>神话 (9张)</p>
                    </label>
                    <div id="fu-lv4" class="fu-level-section"></div>
                </li>
                <li>
                    <input type="radio" name="check" id="active2"><label for="active2">
                        <p>传说 (41张)</p>
                    </label>
                    <div id="fu-lv3" class="fu-level-section"></div>
                </li>
                <li>
                    <input type="radio" name="check" id="active3"><label for="active3">
                        <p>稀有 (56张)</p>
                    </label>
                    <div id="fu-lv2" class="fu-level-section"></div>
                </li>
                <li>
                    <input type="radio" name="check" id="active4"><label for="active4">
                        <p>普通 (36张)</p>
                    </label>
                    <div id="fu-lv1" class="fu-level-section"></div>
                </li>

            </ul>
        </div>
    </div>

    <script type="module">
        document.addEventListener('DOMContentLoaded', function () {
            Promise.all([
                loadJSONData('./seal_info.json'),
                loadJSONData('./fu_info.json'),
                loadJSONData('./seals_page_conf.json'),
                loadJSONData('./fu_page_conf.json')
            ]).then(([sealsData, fuData, confData, fu_conf]) => {
                // 现在这些数据可以直接当作Map/dict使用
                window.sealsinfo = sealsData;
                window.fusinfo = fuData;
                window.sealspageconf = confData;
                window.fu_page_conf = fu_conf;

                const seals_l1 = confData.l1
                const seals_l2 = confData.l2
                const seals_l3 = confData.l3

                create_seals('seals_l1', seals_l1, sealsData.l1);
                create_seals('seals_l2', seals_l2, sealsData.l2);
                create_seals('seals_l3', seals_l3, sealsData.l3);

                loadFuImages(fuData, fu_conf);

            });
        });
    </script>

</body>

</html>
